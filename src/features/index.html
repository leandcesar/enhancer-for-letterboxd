<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Enhancer for Letterboxd - Features</title>

    <meta name="description" content="Explore all features of Enhancer for Letterboxd." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://enhancer-for-letterboxd.vercel.app/features" />

    <meta name="theme-color" content="#14181c" />
    <meta name="color-scheme" content="dark" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HX8E7HHF6W"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-HX8E7HHF6W');
    </script>
    
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>

    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <link rel="icon" href="https://enhancer-for-letterboxd.vercel.app/assets/images/icon.png" />

    <link rel="preload" href="../style.css" as="style" />
    <link rel="stylesheet" href="../style.css" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <main>
        <div class="container">
            <div id="list" class="list"></div>
            <div id="pagination" class="pagination"></div>
        </div>
    </main>

    <footer>
        <div class="footer-wrap">
            <nav class="footer-nav" aria-label="Footer">
                <a href="/">Install</a>
                <a href="/features">Features</a>
                <a href="https://enhancer-for-letterboxd.featurebase.app/en" target="_blank" rel="noopener noreferrer">Feedbacks</a>
                <a href="https://enhancer-for-letterboxd.featurebase.app/en/changelog" target="_blank"
                    rel="noopener noreferrer">Updates</a>
                <button id="share" aria-label="Share this page" type="button">Share</button>
            </nav>

            <p class="copyright">
                Made by
                <a href="https://github.com/leandcesar/" target="_blank" rel="noopener noreferrer">@leandcesar</a>
            </p>
        </div>
    </footer>

    <script defer>
        const CACHE_KEY = "features_cache";
        const CACHE_TTL = 1000 * 60 * 60;
                    const PER_PAGE = 50;

        const list = document.getElementById("list");
        const pagination = document.getElementById("pagination");

        function getPage() {
            const params = new URLSearchParams(location.search);
            return parseInt(params.get("page"), 10) || 1;
        }

        function buildPageUrl(page) {
            return page === 1 ? "/features" : `/features?page=${page}`;
        }

        async function getMarkdown() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TTL) return data;
                }
            } catch { }

            const res = await fetch(
                "https://raw.githubusercontent.com/leandcesar/enhancer-for-letterboxd/main/README.md",
            );

            const text = await res.text();

            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    data: text,
                    timestamp: Date.now()
                }));
            } catch { }

            return text;
        }

        function fixRelativeUrls(content) {
                const base = "https://raw.githubusercontent.com/leandcesar/enhancer-for-letterboxd/main/";

                return content
                    .replace(/!\[(.*?)\]\((.*?)\)/g, (m, alt, url) => {
                        if (url.startsWith("http")) return m;
                        return `![${alt}](${base}${url})`;
                    })
                    .replace(/<img([^>]+)src="([^"]+)"/g, (m, before, url) => {
                        if (url.startsWith("http")) return m;
                        return `<img${before}src="${base}${url}"`;
                    });
            }

        function extractFeatures(md) {
                const section = md.split("## Features")[1]?.split("\n## ")[0];
                if (!section) return [];

                const parts = section.split("\n### ").slice(1);

                return parts
                .map(part => {
                    const [title, ...rest] = part.split("\n");

                    let content = rest.join("\n").trim();

                    content = fixRelativeUrls(content);

                    return {
                        title: title.trim(),
                        content
                    };
                })
                .filter(f => f.title !== "Runtime");
            }

        function renderFeature(f) {
            return `
                <article class="release">
                    <header class="release-header">
                        <div class="release-title">
                            <span>${f.title}</span>
                        </div>
                    </header>

                    <div class="markdown">
                        ${window.marked ? marked.parse(f.content) : f.content}
                    </div>
                </article>
            `;
        }

        async function render() {
            list.textContent = "Loading...";

            try {
                const page = getPage();
                const md = await getMarkdown();
                const features = extractFeatures(md);

                const start = (page - 1) * PER_PAGE;
                const paginated = features.slice(start, start + PER_PAGE);

                list.innerHTML = paginated.map(renderFeature).join("");

                const totalPages = Math.ceil(features.length / PER_PAGE);

                pagination.innerHTML = `
                    ${page > 1 ? `<a href="${buildPageUrl(page - 1)}" rel="prev">Previous</a>` : "<span></span>"}
                    ${page < totalPages ? `<a href="${buildPageUrl(page + 1)}" rel="next">Next</a>` : "<span></span>"}
                `;
            } catch (e) {
                list.textContent = "Failed to load features.";
                console.error(e);
            }
        }

            function trackEvent(name, params = {}) {
                if (window.gtag) {
                    window.gtag("event", name, {
                        page_path: location.pathname,
                        page_title: document.title,
                        ...params
                    });
                }
            }

        document.getElementById("share")?.addEventListener("click", async () => {
            const url = location.href;

            trackEvent("share_click", {
                method: navigator.share ? "native" : "x_tweet",
                share_url: url,
                share_source: "features_page",
                share_title: document.title
            });

            if (navigator.share) {
                try {
                    await navigator.share({ title: document.title, url });
                    return;
                } catch { }
            }

            window.open(
                `https://x.com/intent/tweet?url=${encodeURIComponent(url)}`,
                "_blank"
            );
        });

            document.querySelectorAll('.pagination a').forEach((link) => {
                link.addEventListener('click', () => {
                    const rel = link.getAttribute('rel') || 'none';
                    const target = link.getAttribute('href') || '/features';

                    trackEvent('features_pagination_click', {
                        page_target: target,
                        rel,
                        page_number: target.includes('page=') ? target.split('page=')[1] : '1'
                    });
                    trackEvent(`features_pagination_${rel || 'none'}`, {
                        page_target: target
                    });
                });
            });

            document.querySelectorAll('a[href^="http"]').forEach((link) => {
                const label = (link.textContent || '').trim() || link.getAttribute('aria-label') || 'external_link';
                link.addEventListener('click', () => {
                    trackEvent('outbound_click', {
                        destination: link.href,
                        link_text: label,
                        link_domain: new URL(link.href).hostname,
                        page_section: 'features_footer'
                    });
                    trackEvent(`outbound_click_${new URL(link.href).hostname.replace(/\./g, '_')}`, {
                        destination: link.href,
                        link_text: label
                    });
                });
            });

        render();
    </script>
</body>

</html>
