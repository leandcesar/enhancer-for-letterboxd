<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Enhancer for Letterboxd</title>

    <meta name="description" content="Enhances the Letterboxd experience with additional features." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://enhancer-for-letterboxd.vercel.app/" />

    <meta name="theme-color" content="#14181c" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HX8E7HHF6W"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-HX8E7HHF6W');
    </script>
    
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>

    <link rel="preconnect" href="https://chromewebstore.google.com" />
    <link rel="preconnect" href="https://addons.mozilla.org" />

    <link rel="icon" href="assets/images/icon.png" />
    <link rel="apple-touch-icon" href="assets/images/icon.png" />

    <link rel="preload" as="image" href="assets/images/logo.avif"
        imagesrcset="assets/images/logo.avif 1x, assets/images/logo.webp 1.2x" fetchpriority="high" />
    <link rel="preload" href="style.css" as="style" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <a href="#main" class="skip">Skip to content</a>

    <main id="main">
        <h1 class="sr">Enhancer for Letterboxd</h1>

        <img class="logo" src="assets/images/logo.avif" srcset="assets/images/logo.avif 1x, assets/images/logo.webp 1.2x"
            alt="Enhancer for Letterboxd" decoding="async" fetchpriority="high" width="200" height="200" />

        <div class="install-buttons" id="install-buttons">
            <a id="btn-chrome" class="install"
                href="https://chromewebstore.google.com/detail/abkbjnimmidipmhhhlcnikkifjpdjdpc" target="_blank"
                rel="noopener noreferrer">
                <img src="https://enhancer-for-letterboxd.vercel.app/assets/icons/chrome.svg" alt="" role="presentation"
                    width="24" height="24" decoding="async" />
                Install for Chrome
            </a>

            <a id="btn-firefox" class="install"
                href="https://addons.mozilla.org/pt-BR/firefox/addon/enhancer-for-letterboxd/" target="_blank"
                rel="noopener noreferrer">
                <img src="https://enhancer-for-letterboxd.vercel.app/assets/icons/firefox.svg" alt="" role="presentation"
                    width="24" height="24" decoding="async" />
                Install for Firefox
            </a>
        </div>

        <div class="browsers" aria-hidden="true">
            <span>Coming soon</span>

            <img src="https://enhancer-for-letterboxd.vercel.app/assets/icons/opera.svg" alt="" role="presentation"
                loading="lazy" decoding="async" width="24" height="24" />

            <img src="https://enhancer-for-letterboxd.vercel.app/assets/icons/safari.svg" alt="" role="presentation"
                loading="lazy" decoding="async" width="24" height="24" />
        </div>
    </main>

    <footer>
        <div class="footer-wrap">
            <nav class="footer-nav" aria-label="Footer">
                <a href="/">Install</a>
                <a href="/features">Features</a>
                <a href="https://enhancer-for-letterboxd.featurebase.app/en" target="_blank" rel="noopener noreferrer">Feedbacks</a>
                <a href="https://enhancer-for-letterboxd.featurebase.app/en/changelog" target="_blank"
                    rel="noopener noreferrer">Updates</a>
                <button id="share" aria-label="Share this page" type="button">Share</button>
            </nav>

            <p class="copyright">
                Made by
                <a href="https://github.com/leandcesar/" target="_blank" rel="noopener noreferrer">@leandcesar</a>
            </p>
        </div>
    </footer>

    <script defer>
        const shareBtn = document.getElementById("share");

            function trackEvent(name, params = {}) {
                if (window.gtag) {
                    window.gtag("event", name, {
                        page_path: location.pathname,
                        page_title: document.title,
                        ...params
                    });
                }
            }

        shareBtn?.addEventListener("click", async () => {
            const url = location.href;
            const text = "Enhance the Letterboxd experience with additional features.";

            trackEvent("share_click", {
                method: navigator.share ? "native" : "x_tweet",
                share_url: url
            });

            if (navigator.share) {
                try {
                    await navigator.share({ title: document.title, text, url });
                    return;
                } catch { }
            }

            window.open(
                `https://x.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,
                "_blank",
                "noopener,noreferrer"
            );
        });

        const chromeBtn = document.getElementById("btn-chrome");
        const firefoxBtn = document.getElementById("btn-firefox");
        const container = document.getElementById("install-buttons");

            [chromeBtn, firefoxBtn].forEach((btn) => {
                btn?.addEventListener("click", () => {
                    const browser = btn.id === "btn-firefox" ? "firefox" : "chrome";
                    trackEvent("install_click", {
                        browser,
                        destination: btn.href,
                        install_button: browser,
                        cta_label: btn.textContent.trim()
                    });
                    trackEvent(`install_click_${browser}`, {
                        destination: btn.href,
                        cta_label: btn.textContent.trim()
                    });
                });
            });

            document.querySelectorAll('a[href^="http"]').forEach((link) => {
                const label = (link.textContent || "").trim() || link.getAttribute("aria-label") || "external_link";
                link.addEventListener("click", () => {
                    trackEvent("outbound_click", {
                        destination: link.href,
                        link_text: label,
                        link_domain: new URL(link.href).hostname
                    });
                    trackEvent(`outbound_click_${new URL(link.href).hostname.replace(/\./g, "_")}`, {
                        destination: link.href,
                        link_text: label
                    });
                });
            });

        if (chromeBtn && firefoxBtn && container) {
            const isFirefox = navigator.userAgent.includes("Firefox");
            const recommended = isFirefox ? firefoxBtn : chromeBtn;

            recommended.classList.add("recommended");

            if (container.firstElementChild !== recommended) {
                container.prepend(recommended);
            }
        }
    </script>
</body>

</html>
